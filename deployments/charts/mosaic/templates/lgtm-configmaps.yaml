apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosaic.fullname" . }}-otel-lgtm-config
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
data:
  otelcol-config.yaml: |-
    {{- .Files.Get "files/otel-collector-config.yaml" | nindent 4 }}
  prometheus.yaml: |-
    {{- include "mosaic.prometheusConfig" . | nindent 4 }}
  loki-config.yaml: |-
    {{- .Files.Get "files/loki-config.yaml" | nindent 4 }}
  recording-rules.yaml: |-
    {{- .Files.Get "files/recording-rules.yaml" | nindent 4 }}
  grafana.ini: |-
    {{- .Files.Get "files/grafana.ini" | nindent 4 }}
  dashboards.yml: |-
    {{- .Files.Get "files/dashboards/dashboards.yml" | nindent 4 }}
{{- /* One ConfigMap per dashboard keeps each object well under the 1 MiB limit */}}
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosaic.fullname" $ }}-dashboard-{{ base $path | trimSuffix ".json" | replace "_" "-" }}
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" $ "component" "otel-lgtm") | nindent 4 }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- if .Values.lgtm.fileSd }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mosaic.fullname" . }}-file-sd
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
data:
  {{- range $file, $groups := .Values.lgtm.fileSd }}
  {{ $file }}: |-
    {{- toYaml $groups | nindent 4 }}
  {{- end }}
{{- end }}
