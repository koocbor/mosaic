apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mosaic.fullname" . }}-otel-lgtm
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
{{- if .Values.lgtm.prometheus.kubernetesSd.enabled }}
---
# Lets Prometheus discover the exporter pods in the release namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mosaic.fullname" . }}-otel-lgtm
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mosaic.fullname" . }}-otel-lgtm
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mosaic.fullname" . }}-otel-lgtm
subjects:
  - kind: ServiceAccount
    name: {{ include "mosaic.fullname" . }}-otel-lgtm
    namespace: {{ .Release.Namespace }}
{{- end }}
