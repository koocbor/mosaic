{{- if .Values.lgtm.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mosaic.fullname" . }}-otel-lgtm-data
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.lgtm.persistence.accessModes | nindent 4 }}
  {{- with .Values.lgtm.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.lgtm.persistence.size }}
{{- end }}
