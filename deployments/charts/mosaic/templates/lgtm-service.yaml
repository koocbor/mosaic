apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.lgtm.service.name }}
  labels:
    {{- include "mosaic.componentLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
  {{- with .Values.lgtm.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.lgtm.service.type }}
  selector:
    {{- include "mosaic.selectorLabels" (dict "ctx" . "component" "otel-lgtm") | nindent 4 }}
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: loki
      port: 3100
      targetPort: loki
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: otel-metrics
      port: 8889
      targetPort: otel-metrics
    - name: prometheus
      port: 9090
      targetPort: prometheus
